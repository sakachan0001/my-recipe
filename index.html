<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Food｜Recipe & Dining</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#292722;--muted:#817a70;--accent:#a15c37;--line:#e2ddd4}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,textarea{font:inherit} button{cursor:pointer;border:0}
.app{min-height:100vh}.top{height:86px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.brand{font-size:30px;font-weight:700}.sub{font-size:13px;color:var(--muted);margin-left:12px}
.primary{background:var(--accent);color:white;border-radius:12px;padding:13px 20px;font-weight:700}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 86px)}
.side{background:#fff;border-right:1px solid var(--line);padding:24px 18px}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:20px;background:#faf9f6}
.nav button{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:10px;background:transparent;color:var(--text);margin:3px 0}.nav button.active,.nav button:hover{background:#f1ece5;color:var(--accent)}
main{padding:30px;max-width:1400px;width:100%;margin:auto}.page-title{font-size:26px;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:22px}
.recipe-card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 10px #00000008}.photo{height:220px;background:#e9e4da;display:flex;align-items:center;justify-content:center;color:#928b80}.photo img{width:100%;height:100%;object-fit:cover}.card-body{padding:16px}.card-name{font-size:20px;font-weight:700}.date{color:var(--muted);font-size:14px;margin-top:6px}
.detail{display:grid;grid-template-columns:1.05fr 1fr;gap:28px}.hero{width:100%;max-height:520px;object-fit:cover;border-radius:20px;background:#e9e4da}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}.panel h3{margin:0 0 14px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:25px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee9e1;padding:9px 0}.link{color:var(--accent);text-decoration:none}.record{border-top:1px solid var(--line);padding:18px 0}.stars{letter-spacing:2px}.best{color:#a15c37;font-weight:700}.back{background:transparent;color:var(--muted);padding:0;margin-bottom:18px}
.form{max-width:1000px}.field{margin-bottom:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px}.field textarea{min-height:90px;resize:vertical}.rows{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.row{display:grid;grid-template-columns:1fr 180px 42px;gap:8px;margin-bottom:8px}.row input{padding:10px;border:1px solid var(--line);border-radius:9px}.remove{background:#f0ece6;border-radius:9px}.addrow{background:transparent;color:var(--accent);padding:7px 0}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:25px}
.hidden{display:none!important}.empty{text-align:center;padding:70px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:repeat(2,minmax(180px,1fr))}.detail{grid-template-columns:1fr}.top{padding:0 16px}.sub{display:none}}
.dishrow{grid-template-columns:1.2fr .5fr 1.5fr auto}.dishrow input{min-width:0}@media(max-width:900px){.dishrow{grid-template-columns:1fr 90px 1fr auto}}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}.dishrow{grid-template-columns:1fr 80px}.dishrow input:nth-child(3){grid-column:1/-1}}\n</style>
</head>
<body>
<div class="app">
<header class="top"><div><span class="brand">🍳 My Recipe</span><span class="sub">作って、記録して、自分の定番へ</span></div><div style="display:flex;gap:10px;align-items:center"><button class="addrow" style="padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#faf9f6" onclick="showDiningAdd()">🍽️ 外食を追加</button><button class="primary" onclick="showAdd()">＋ 料理を追加</button></div></header>
<div class="layout">
<aside class="side">
<input id="search" class="search" placeholder="🔎 料理・店名・料理名を検索" oninput="renderHome()">
<nav class="nav">
<button class="active" onclick="filterBy('all',this)">すべて</button>
<button onclick="filterBy('fav',this)">★ お気に入り</button>
<button onclick="filterBy('best',this)">🏆 マイベスト</button><button onclick="showDiningHome(this)">🍽️ 外食</button>
<button onclick="filterBy('和食',this)">和食</button><button onclick="filterBy('洋食',this)">洋食</button><button onclick="filterBy('中華',this)">中華</button><button onclick="filterBy('その他',this)">その他</button>
</nav></aside>
<main>
<section id="home"></section><section id="detail" class="hidden"></section><section id="add" class="hidden"></section><section id="diningHome" class="hidden"></section><section id="diningDetail" class="hidden"></section>
</main>
</div></div>
<script>
const KEY="myrecipe_v1";
let data=[];
let dining=[];
let diningMode=false;

/* iPad専用: IndexedDBを正式な保存先にする */
const IDB_NAME="myfood_app_v1", IDB_STORE="records";
let idbReady=null;
function openAppDB(){
  if(idbReady)return idbReady;
  idbReady=new Promise((resolve,reject)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
  return idbReady;
}
function dbGet(k){return openAppDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,"readonly");const r=t.objectStore(IDB_STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
function dbSet(k,v){return openAppDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,"readwrite");t.objectStore(IDB_STORE).put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error)}))}

function normalizeDining(raw){
  if(!Array.isArray(raw)) return [];
  // v9以降: 店舗と訪問履歴を分離した形式
  if(raw.every(x=>Array.isArray(x.visits))) return raw;
  // 旧形式: 1件の外食記録＝1店舗だったデータを店舗ごとにまとめる
  const shops=[];
  const map=new Map();
  raw.forEach((d,idx)=>{
    const shop=String(d.shop||"無題の店");
    const branch=String(d.branch||"");
    const key=shop+"\u001f"+branch;
    let s=map.get(key);
    if(!s){
      s={id:Date.now()+idx,shop,branch,address:d.address||"",url:d.url||"",rating:Number(d.rating)||5,priceRange:d.priceRange||"",comment:d.comment||"",wantAgain:d.wantAgain||"",visits:[]};
      map.set(key,s); shops.push(s);
    }
    s.visits.push({id:d.id||Date.now()+idx+1000,date:d.date||"",dateInput:d.dateInput||"",withWho:d.withWho||"",bill:d.bill||"",nextTime:d.nextTime||"",dishes:Array.isArray(d.dishes)?d.dishes:[],photos:Array.isArray(d.photos)?d.photos:[]});
  });
  return shops;
}
function latestDiningVisit(s){return (s.visits||[]).slice().sort((a,b)=>(b.dateInput||b.date||"").localeCompare(a.dateInput||a.date||""))[0]||null}
function diningHero(s){const v=latestDiningVisit(s);return v&&v.photos&&v.photos.length?v.photos[0]:""}
function diningStars(n){n=Math.max(0,Math.min(5,Number(n)||0));return "★".repeat(n)+"☆".repeat(5-n)}
function diningShopText(s){return `${s.shop||""} ${s.branch||""} ${s.address||""} ${s.url||""} ${s.priceRange||""} ${s.comment||""} ${s.wantAgain||""} ${(s.visits||[]).map(v=>`${v.date||""} ${v.withWho||""} ${v.bill||""} ${v.nextTime||""} ${(v.dishes||[]).map(x=>`${x.name||""} ${x.comment||""}`).join(" ")}`).join(" ")}`}
function visitById(s,id){return (s.visits||[]).find(v=>String(v.id)===String(id))}
function shopById(id){return dining.find(s=>String(s.id)===String(id))}
const defaultRecipes=[{id:1,name:"夏すき焼き",category:"その他",url:"https://cgc-kitchen365.jp/search/detail/627a01893ae0082873304fbb",ingredients:[["牛肩ロース","400g"],["トマト","○個"],["オクラ","○本"],["かぼちゃ","○g"],["みょうが","○個"],["大根おろし","○g"],["すだち","○個"]],seasonings:[["醤油","○○"],["みりん","○○"],["砂糖","○○"],["酒","○○"]],records:[{date:"2026/9/12",photo:"",changes:"トマト多め・すだち追加",memo:"さっぱりして美味しい",rating:4,best:false}]}];
async function initStorage(){
  try{
    let d=await dbGet(KEY), x=await dbGet("myrecipe_dining_v1");
    // 既存のlocalStorageデータがあれば一度だけIndexedDBへ移行
    if(d===undefined){ const old=localStorage.getItem(KEY); d=old?JSON.parse(old):defaultRecipes; await dbSet(KEY,d); }
    if(x===undefined){ const old=localStorage.getItem("myrecipe_dining_v1"); x=old?JSON.parse(old):[]; }
    // 旧形式の外食データがIndexedDBに既に入っている場合も、店舗＋訪問履歴へ変換する
    x=normalizeDining(x||[]);
    await dbSet("myrecipe_dining_v1",x);
    data=d||defaultRecipes; dining=x;
    renderHome();
  }catch(e){
    console.error(e); alert("データの読み込みに失敗しました。アプリを閉じずに再読み込みしてください。");
  }
}
function save(){ dbSet(KEY,data).catch(e=>alert("保存できませんでした。")); return true; }
function saveDining(){ dbSet("myrecipe_dining_v1",dining).catch(e=>alert("保存できませんでした。")); return true; }
function showOnly(id){
 ["home","detail","add","diningHome","diningDetail"].forEach(x=>document.getElementById(x).classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}
function showDiningHome(el){
  diningMode=true; currentFilter="dining";
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  if(el) el.classList.add("active");
  showOnly("diningHome");
  const q=(document.getElementById("search").value||"").trim().toLowerCase();
  const arr=dining.filter(s=>!q||diningShopText(s).toLowerCase().includes(q));
  document.getElementById("diningHome").innerHTML=`<h1 class="page-title">🍽️ 外食記録</h1>
  <div style="color:var(--muted);margin:-12px 0 18px">${q?`「${esc(q)}」を検索中`:"店・料理・コメントを検索できます"}</div>
  <div class="grid">${arr.map(s=>{const v=latestDiningVisit(s);return `<article class="recipe-card" onclick="showDiningDetail(${s.id})">
  <div class="photo">${diningHero(s)?`<img src="${diningHero(s)}">`:"写真"}</div>
  <div class="card-body"><div class="card-name">${esc(s.shop)}${s.branch?`｜${esc(s.branch)}`:""}</div>
  <div class="date">${esc(v?.date||"")}　${(v?.dishes||[]).map(x=>x.name).filter(Boolean).join("、")}</div>
  <div class="stars" style="margin-top:7px">${diningStars(s.rating)}</div></div></article>`}).join("")||'<div class="empty">外食記録がありません</div>'}</div>`;
}
function showDiningDetail(shopId){
  const s=shopById(shopId); if(!s)return;
  showOnly("diningDetail");
  const visits=(s.visits||[]).slice().sort((a,b)=>(b.dateInput||b.date||"").localeCompare(a.dateInput||a.date||""));
  const hero=diningHero(s);
  document.getElementById("diningDetail").innerHTML=`<button class="back" onclick="showDiningHome()">← 外食一覧</button>
  <div class="detail"><div>
  <div class="photo hero">${hero?`<img src="${hero}">`:"写真を追加"}</div>
  <div class="panel" style="margin-top:18px"><h3>店舗Webサイト</h3>${s.url?`<a class="link" href="${escAttr(s.url)}" target="_blank">🔗 Webサイトを見る</a>`:"未登録"}</div>
  </div>
  <div>
  <div class="panel"><h2 style="margin-top:0">🏪 ${esc(s.shop)}${s.branch?`｜${esc(s.branch)}`:""}</h2>
  <div class="item"><span>📍 場所</span><span>${esc(s.address||"未登録")}</span></div>
  <div class="item"><span>⭐ 店の評価</span><span class="stars">${diningStars(s.rating)}</span></div>
  <div class="item"><span>💰 価格帯</span><span>${esc(s.priceRange||"未登録")}</span></div>
  <div style="margin-top:12px">${esc(s.comment||"")}</div>
  <div style="margin-top:12px"><b>また行きたい：</b>${esc(s.wantAgain||"")}</div>
  <div class="actions"><button class="addrow" onclick="showDiningStoreEdit(${s.id})">✏️ 店舗情報を編集</button><button class="addrow" onclick="deleteDiningShop(${s.id})">🗑 店舗を削除</button></div>
  </div>
  <div class="panel"><h3>🍽️ 訪問履歴（${visits.length}回）</h3>
  ${visits.map((v,i)=>`<div class="record"><b>${visits.length-i}回目｜${esc(v.date||"日時未登録")}</b>
  <div style="margin-top:8px">👥 ${esc(v.withWho||"未登録")}　💴 ${esc(v.bill||"未登録")}</div>
  ${(v.photos||[]).length?`<div style="display:flex;flex-wrap:wrap;margin-top:10px">${v.photos.map(p=>`<img src="${p}" style="width:180px;height:130px;object-fit:cover;border-radius:12px;margin:0 8px 8px 0">`).join("")}</div>`:""}
  <div style="margin:12px 0 6px"><b>料理</b></div>
  ${(v.dishes||[]).map(x=>`<div style="margin:7px 0"><b>${esc(x.name||"料理")}</b>　<span class="stars">${diningStars(x.rating)}</span><div style="color:var(--muted);margin-top:3px">${esc(x.comment||"")}</div></div>`).join("")||"料理の記録なし"}
  ${v.nextTime?`<div style="margin-top:10px"><b>次回食べたいもの：</b>${esc(v.nextTime)}</div>`:""}
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="addrow" onclick="showDiningVisitEdit(${s.id},${v.id})">✏️ この回を編集</button><button class="addrow" onclick="deleteDiningVisit(${s.id},${v.id})">🗑 この回を削除</button></div>
  </div>`).join("")||'<div class="empty">訪問記録がありません</div>'}
  <button class="primary" onclick="showDiningAddVisit(${s.id})">＋ 次回の記録を追加</button></div></div></div>`;
}
function diningStoreFormHTML(s){
  return `<button class="back" onclick="showDiningDetail(${s.id})">← 戻る</button><div class="form"><h1 class="page-title">店舗情報を編集</h1>
  <div class="field"><label>店名</label><input id="dshop" value="${escAttr(s.shop||"")}"></div>
  <div class="field"><label>支店名</label><input id="dbranch" value="${escAttr(s.branch||"")}"></div>
  <div class="field"><label>住所・場所</label><input id="daddress" value="${escAttr(s.address||"")}"></div>
  <div class="field"><label>店舗Webサイト</label><input id="durl" type="url" placeholder="https://" value="${escAttr(s.url||"")}"></div>
  <div class="field"><label>店の評価</label><input id="drating" type="number" min="1" max="5" value="${s.rating||5}"></div>
  <div class="field"><label>価格帯</label><input id="dprice" placeholder="例：1人5,000円程度" value="${escAttr(s.priceRange||"")}"></div>
  <div class="field"><label>店のコメント</label><textarea id="dcomment">${escText(s.comment||"")}</textarea></div>
  <div class="field"><label>また行きたい</label><input id="dwant" placeholder="◎ / ○ / △ / ×" value="${escAttr(s.wantAgain||"")}"></div>
  <div class="actions"><button class="primary" onclick="saveDiningStoreEdit(${s.id})">保存</button><button class="addrow" onclick="showDiningDetail(${s.id})">保存せず戻る</button></div></div>`;
}
function diningVisitFormHTML(s,v,mode){
  const dishes=(v?.dishes||[{name:"",rating:5,comment:""}]);
  return `<button class="back" onclick="showDiningDetail(${s.id})">← 戻る</button><div class="form"><h1 class="page-title">${mode==="edit"?"訪問記録を編集":`${esc(s.shop)}｜次回の記録`}</h1>
  <div class="field"><label>日時</label><input id="ddate" type="datetime-local" value="${escAttr(v?.dateInput||"")}"></div>
  <div class="field"><label>誰と</label><input id="dwith" value="${escAttr(v?.withWho||"")}"></div>
  <div class="field"><label>会計</label><input id="dbill" value="${escAttr(v?.bill||"")}"></div>
  <div class="field"><label>次回食べたいもの</label><input id="dnext" value="${escAttr(v?.nextTime||"")}"></div>
  <div class="field"><label>食べた料理</label><div id="ddishes">${dishes.map(x=>`<div class="row dishrow"><input value="${escAttr(x.name||"")}" placeholder="料理名"><input type="number" min="1" max="5" value="${x.rating||5}" placeholder="評価"><input value="${escAttr(x.comment||"")}" placeholder="料理の感想"><button class="remove" onclick="this.parentElement.remove()">×</button></div>`).join("")}<button class="addrow" onclick="addDiningDish()">＋ 料理を追加</button></div></div>
  <div class="field"><label>写真（複数枚可）</label><input id="dphotos" type="file" accept="image/*" multiple onchange="previewDiningPhotos(this)"><div id="dpreview" style="margin-top:10px">${(v?.photos||[]).map(p=>`<img src="${p}" style="width:120px;height:90px;object-fit:cover;border-radius:10px;margin:0 6px 6px 0">`).join("")}</div>${v?`<div style="margin-top:8px"><button type="button" class="addrow" onclick="clearDiningPhotos(${s.id},${v.id})">🗑 写真を削除</button></div>`:""}</div>
  <div class="actions"><button class="primary" onclick="${mode==="edit"?`saveDiningVisitEdit(${s.id},${v.id})`:`saveDiningVisitNew(${s.id})`}">保存</button><button class="addrow" onclick="showDiningDetail(${s.id})">保存せず戻る</button>${mode==="edit"?`<button class="remove" style="padding:10px 14px" onclick="deleteDiningVisit(${s.id},${v.id})">🗑 この回を削除</button>`:""}</div></div>`;
}
function diningNewFormHTML(){
  return `<button class="back" onclick="showDiningHome()">← 外食一覧</button><div class="form"><h1 class="page-title">新しい外食記録</h1>
  <h3>🏪 店舗情報</h3>
  <div class="field"><label>店名</label><input id="dshop" value=""></div><div class="field"><label>支店名</label><input id="dbranch" value=""></div><div class="field"><label>住所・場所</label><input id="daddress" value=""></div><div class="field"><label>店舗Webサイト</label><input id="durl" type="url" placeholder="https://" value=""></div><div class="field"><label>店の評価</label><input id="drating" type="number" min="1" max="5" value="5"></div><div class="field"><label>価格帯</label><input id="dprice" placeholder="例：1人5,000円程度" value=""></div><div class="field"><label>店のコメント</label><textarea id="dcomment"></textarea></div><div class="field"><label>また行きたい</label><input id="dwant" placeholder="◎ / ○ / △ / ×" value=""></div>
  <h3>🍽️ 1回目の訪問</h3>
  <div class="field"><label>日時</label><input id="ddate" type="datetime-local"></div><div class="field"><label>誰と</label><input id="dwith" value=""></div><div class="field"><label>会計</label><input id="dbill" value=""></div><div class="field"><label>次回食べたいもの</label><input id="dnext" value=""></div>
  <div class="field"><label>食べた料理</label><div id="ddishes"><div class="row dishrow"><input placeholder="料理名"><input type="number" min="1" max="5" value="5"><input placeholder="料理の感想"><button class="remove" onclick="this.parentElement.remove()">×</button></div><button class="addrow" onclick="addDiningDish()">＋ 料理を追加</button></div></div>
  <div class="field"><label>写真（複数枚可）</label><input id="dphotos" type="file" accept="image/*" multiple onchange="previewDiningPhotos(this)"><div id="dpreview" style="margin-top:10px"></div></div>
  <div class="actions"><button class="primary" onclick="saveDiningNew()">保存</button><button class="addrow" onclick="showDiningHome()">保存せず戻る</button></div></div>`;
}
function addDiningDish(){const box=document.getElementById("ddishes"),b=box.querySelector(".addrow"),div=document.createElement("div");div.className="row dishrow";div.innerHTML=`<input placeholder="料理名"><input type="number" min="1" max="5" value="5"><input placeholder="料理の感想"><button class="remove" onclick="this.parentElement.remove()">×</button>`;box.insertBefore(div,b)}
let pendingDiningPhotos=[]; let diningPhotoReady=true;
function compressDiningFile(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onerror=()=>reject(rd.error||new Error("read error"));rd.onload=e=>{const im=new Image();im.onerror=()=>reject(new Error("image error"));im.onload=()=>{const max=520,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext("2d").drawImage(im,0,0,c.width,c.height);let q=.48,jpg=c.toDataURL("image/jpeg",q);while(jpg.length>180000&&q>.28){q-=.05;jpg=c.toDataURL("image/jpeg",q)}resolve(jpg)};im.src=e.target.result};rd.readAsDataURL(file)})}
async function previewDiningPhotos(input){pendingDiningPhotos=[];diningPhotoReady=false;const files=[...input.files].slice(0,6),preview=document.getElementById("dpreview");if(!files.length){diningPhotoReady=true;return}preview.innerHTML="写真を圧縮中…";try{for(const f of files)pendingDiningPhotos.push(await compressDiningFile(f));preview.innerHTML=pendingDiningPhotos.map(p=>`<img src="${p}" style="width:120px;height:90px;object-fit:cover;border-radius:10px;margin:0 6px 6px 0">`).join("");diningPhotoReady=true}catch(e){diningPhotoReady=false;preview.innerHTML="写真の圧縮に失敗しました";alert("写真の読み込みに失敗しました。別の写真で試してください。")}}
function collectDiningDishes(){return [...document.querySelectorAll("#ddishes .dishrow")].map(x=>({name:x.children[0].value,rating:Math.max(1,Math.min(5,+x.children[1].value||5)),comment:x.children[2].value})).filter(x=>x.name)}
function getDiningStoreValues(s){return {shop:document.getElementById("dshop").value||"無題の店",branch:document.getElementById("dbranch").value,address:document.getElementById("daddress").value,url:document.getElementById("durl").value,rating:Math.max(1,Math.min(5,+document.getElementById("drating").value||5)),priceRange:document.getElementById("dprice").value,comment:document.getElementById("dcomment").value,wantAgain:document.getElementById("dwant").value}}
function getDiningVisitValues(oldPhotos=[]){const di=document.getElementById("ddate").value,display=di?new Date(di).toLocaleString("ja-JP"):"";return {date:display,dateInput:di,withWho:document.getElementById("dwith").value,bill:document.getElementById("dbill").value,nextTime:document.getElementById("dnext").value,dishes:collectDiningDishes(),photos:pendingDiningPhotos.length?pendingDiningPhotos:oldPhotos}}
function showDiningAdd(){diningMode=true;pendingDiningPhotos=[];diningPhotoReady=true;showOnly("add");document.getElementById("add").innerHTML=diningNewFormHTML()}
async function saveDiningNew(){if(!diningPhotoReady){alert("写真の圧縮が終わるまで少し待ってください。");return}const s={id:Date.now(),...getDiningStoreValues(),visits:[{id:Date.now()+1,...getDiningVisitValues()}]};dining.unshift(s);if(await saveDining()){pendingDiningPhotos=[];showDiningDetail(s.id)}else{dining.shift()}}
function showDiningStoreEdit(id){const s=shopById(id);if(!s)return;pendingDiningPhotos=[];diningPhotoReady=true;showOnly("add");document.getElementById("add").innerHTML=diningStoreFormHTML(s)}
async function saveDiningStoreEdit(id){const s=shopById(id);if(!s)return;const old={...s};Object.assign(s,getDiningStoreValues(s));if(await saveDining()){showDiningDetail(id)}else{Object.assign(s,old)}}
function showDiningAddVisit(shopId){const s=shopById(shopId);if(!s)return;pendingDiningPhotos=[];diningPhotoReady=true;showOnly("add");document.getElementById("add").innerHTML=diningVisitFormHTML(s,null,"new")}
async function saveDiningVisitNew(shopId){if(!diningPhotoReady){alert("写真の圧縮が終わるまで少し待ってください。");return}const s=shopById(shopId);if(!s)return;const v={id:Date.now(),...getDiningVisitValues()};s.visits=s.visits||[];s.visits.push(v);if(await saveDining()){pendingDiningPhotos=[];showDiningDetail(shopId)}else{s.visits.pop()}}
function showDiningVisitEdit(shopId,visitId){const s=shopById(shopId),v=s&&visitById(s,visitId);if(!s||!v)return;pendingDiningPhotos=[];diningPhotoReady=true;showOnly("add");document.getElementById("add").innerHTML=diningVisitFormHTML(s,v,"edit")}
async function saveDiningVisitEdit(shopId,visitId){if(!diningPhotoReady){alert("写真の圧縮が終わるまで少し待ってください。");return}const s=shopById(shopId),v=s&&visitById(s,visitId);if(!s||!v)return;const old={...v};Object.assign(v,getDiningVisitValues(v.photos||[]));if(await saveDining()){pendingDiningPhotos=[];showDiningDetail(shopId)}else{Object.assign(v,old)}}
async function clearDiningPhotos(shopId,visitId){const s=shopById(shopId),v=s&&visitById(s,visitId);if(!s||!v)return;if(confirm("この訪問記録の写真をすべて削除しますか？")){const old=v.photos||[];v.photos=[];pendingDiningPhotos=[];if(await saveDining()){showDiningVisitEdit(shopId,visitId)}else{v.photos=old}}}
async function deleteDiningVisit(shopId,visitId){const s=shopById(shopId);if(!s)return;const v=visitById(s,visitId);if(!v)return;if(confirm("この訪問記録を削除しますか？")){const old=s.visits;s.visits=s.visits.filter(x=>String(x.id)!==String(visitId));if(await saveDining()){showDiningDetail(shopId)}else{s.visits=old}}}
async function deleteDiningShop(shopId){const s=shopById(shopId);if(!s)return;if(confirm(`「${s.shop}」を店舗ごと削除しますか？\nすべての訪問履歴と写真も削除されます。`)){const old=dining;dining=dining.filter(x=>String(x.id)!==String(shopId));if(await saveDining()){showDiningHome()}else{dining=old}}}

let currentFilter="all";
// save() はIndexedDB版を使用
function imgSrc(r){return r.photo||""}
function renderHome(){
 showOnly("home");
 diningMode=false;
 let q=(document.getElementById("search").value||"").trim().toLowerCase();
 if(diningMode && currentFilter==="dining"){showDiningHome();return;}
 let arr=data.filter(r=>{
   let hay=[
     r.name,r.category,
     ...(r.ingredients||[]).flat(),
     ...(r.seasonings||[]).flat(),
     ...(r.records||[]).flatMap(x=>[x.changes||"",x.memo||""])
   ].join(" ").toLowerCase();
   let matches=!q||hay.includes(q);
   let filterOK=currentFilter==="all" ||
     (currentFilter==="fav" && !!r.favorite) ||
     (currentFilter==="best" && r.records.some(x=>x.best)) ||
     r.category===currentFilter;
   return filterOK && matches;
 });
 let title=currentFilter==="fav"?"⭐ お気に入り":currentFilter==="best"?"🏆 マイベスト":currentFilter==="all"?"最近作った料理":currentFilter;
 document.getElementById("home").innerHTML=`<h1 class="page-title">${title}</h1><div style="color:var(--muted);margin:-12px 0 18px">${q?`「${esc(q)}」を検索中`:""}</div><div class="grid">${arr.map(r=>`<article class="recipe-card" onclick="showDetail(${r.id})"><div class="photo">${(r.records.find(x=>x.best)?.photo || r.records[r.records.length-1]?.photo || r.records[0]?.photo)?`<img src="${r.records.find(x=>x.best)?.photo || r.records[r.records.length-1]?.photo || r.records[0]?.photo}">`:"写真"}</div><div class="card-body"><div class="card-name">${r.name} ${r.favorite?"⭐":""} ${r.records.some(x=>x.best)?"🏆":""}</div><div class="date">${r.records[0]?.date||""}</div></div></article>`).join("")||'<div class="empty">料理がありません</div>'}</div>`;
}
function filterBy(f,el){diningMode=false;currentFilter=f;document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));el.classList.add("active");renderHome()}
function toggleFavorite(id){
 let r=data.find(x=>x.id===id); if(!r)return;
 r.favorite=!r.favorite;
 save();
 showDetail(id);
}
function showDetail(id){diningMode=false;showOnly("detail");
 let r=data.find(x=>x.id===id); document.getElementById("home").classList.add("hidden");document.getElementById("add").classList.add("hidden");let sec=document.getElementById("detail");sec.classList.remove("hidden");
 let best=r.records.find(x=>x.best);
 sec.innerHTML=`<button class="back" onclick="renderHome()">← 戻る</button><div class="detail">
 <div><div class="photo hero">${(best?.photo || r.records[r.records.length-1]?.photo || r.records[0]?.photo)?`<img src="${best?.photo || r.records[r.records.length-1]?.photo || r.records[0]?.photo}">`:"写真を追加"}</div>
 <div class="panel" style="margin-top:18px"><h3>参考レシピ</h3><a class="link" href="${r.url}" target="_blank">🔗 レシピを見る</a></div></div>
 <div><div class="panel"><h2 style="margin-top:0">${r.name} ${r.favorite?"⭐":""} ${best?"🏆 MY BEST":""}</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="addrow" style="border:1px solid var(--line);padding:9px 12px;border-radius:9px;background:#faf9f6" onclick="toggleFavorite(${r.id})">${r.favorite?"⭐ お気に入りを外す":"☆ お気に入りに追加"}</button><button class="addrow" style="border:1px solid var(--line);padding:9px 12px;border-radius:9px;background:#faf9f6" onclick="showEdit(${r.id})">✏️ 材料・調味料を編集</button><button class="addrow" style="border:1px solid #e8c9c0;padding:9px 12px;border-radius:9px;background:#fff5f2;color:#a33" onclick="deleteRecipe(${r.id})">🗑 この料理を削除</button></div><div class="cols"><div><h3>材料</h3>${r.ingredients.map(x=>`<div class="item"><span>${x[0]}</span><span>${x[1]}</span></div>`).join("")}</div><div><h3>調味料</h3>${r.seasonings.map(x=>`<div class="item"><span>${x[0]}</span><span>${x[1]}</span></div>`).join("")}</div></div></div>
 <div class="panel"><h3>作った記録</h3>${best?`<div style="color:var(--muted);font-size:14px;margin:-4px 0 12px">🏆 MY BESTは、この料理で一番気に入った「作り方の記録」です。</div>`:""}${r.records.map((x,i)=>`<div class="record"><b>${i+1}回目｜${x.date}</b> ${x.best?'<span class="best">🏆 MY BEST</span>':''}
${x.photo?`<div style="margin:12px 0"><img src="${x.photo}" style="width:240px;height:160px;object-fit:cover;border-radius:12px"></div>`:""}
<div class="stars">${"★".repeat(x.rating||0)}${"☆".repeat(5-(x.rating||0))}</div><div style="margin-top:8px">${x.changes||"アレンジなし"}</div><div style="color:var(--muted);margin-top:5px">${x.memo||""}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="addrow" onclick="editRecord(${r.id},${i})">✏️ この回を編集</button>${!x.best?`<button class="addrow" onclick="promote(${r.id},${i})">🏆 この回をマイベストに昇格</button>`:""}</div></div>`).join("")}<button class="primary" onclick="showAddRecord(${r.id})">＋ 次回の記録を追加</button></div></div></div>`;
}

function showEdit(id){diningMode=false;
 let r=data.find(x=>x.id===id); if(!r)return;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("detail").classList.add("hidden");
 let s=document.getElementById("add"); s.classList.remove("hidden");
 s.innerHTML=editFormHTML(r);
}
function editFormHTML(r){
 return `<button class="back" onclick="showDetail(${r.id})">← 戻る</button>
 <div class="form"><h1 class="page-title">料理を編集</h1>
 <div class="field"><label>料理名</label><input id="name" value="${esc(r.name)}"></div>
 <div class="field"><label>参考レシピURL</label><input id="url" value="${esc(r.url||"")}"></div>
 <div class="field"><label>カテゴリ</label><input id="cat" value="${esc(r.category||"その他")}"></div>
 ${editRowsHTML("材料","ing",r.ingredients)}
 ${editRowsHTML("調味料","sea",r.seasonings)}
 <div class="actions"><button class="primary" onclick="saveEdit(${r.id})">保存</button></div></div>`;
}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function editRowsHTML(title,id,items){
 let rows=(items||[]).map(x=>`<div class="row"><input value="${esc(x[0])}" placeholder="${title}"><input value="${esc(x[1])}" placeholder="分量"><button class="remove" onclick="this.parentElement.remove()">×</button></div>`).join("");
 if(!rows) rows=`<div class="row"><input placeholder="${title}"><input placeholder="分量"><button class="remove" onclick="this.parentElement.remove()">×</button></div>`;
 return `<div class="field"><label>${title}</label><div class="rows" id="${id}">${rows}<button class="addrow" onclick="addRow('${id}','${title}')">＋ ${title}を追加</button></div></div>`;
}
function saveEdit(id){
 let r=data.find(x=>x.id===id); if(!r)return;
 r.name=document.getElementById("name").value||"無題の料理";
 r.url=document.getElementById("url").value;
 r.category=document.getElementById("cat").value||"その他";
 r.ingredients=collect("ing"); r.seasonings=collect("sea");
 save(); showDetail(id);
}
function deleteRecipe(id){
 let r=data.find(x=>x.id===id); if(!r)return;
 if(!confirm(`「${r.name}」を削除しますか？\n作った記録もすべて削除されます。`)) return;
 data=data.filter(x=>x.id!==id); save(); renderHome();
}
function showAdd(){diningMode=false;showOnly("add");let s=document.getElementById("add");s.innerHTML=formHTML()}
function formHTML(){return `<button class="back" onclick="renderHome()">← 戻る</button><div class="form"><h1 class="page-title">新しい料理</h1>
<div class="field"><label>料理名</label><input id="name" value=""></div><div class="field"><label>参考レシピURL</label><input id="url" value="https://"></div>
<div class="field"><label>カテゴリ</label><input id="cat" value="その他"></div>${rowsHTML("材料","ing")} ${rowsHTML("調味料","sea")}
<div class="field"><label>完成写真</label><input id="photo" type="file" accept="image/*" onchange="previewPhoto(this)"><div id="preview" style="margin-top:10px"></div></div>
<div class="field"><label>今回のアレンジ</label><textarea id="changes"></textarea></div><div class="field"><label>感想</label><textarea id="memo"></textarea></div>
<div class="field"><label>評価</label><input id="rating" type="number" min="1" max="5" value="5"></div><div class="actions"><button class="primary" onclick="saveNew()">保存</button></div></div>`}
function rowsHTML(title,id){return `<div class="field"><label>${title}</label><div class="rows" id="${id}"><div class="row"><input placeholder="${title}"><input placeholder="分量"><button class="remove" onclick="this.parentElement.remove()">×</button></div><button class="addrow" onclick="addRow('${id}','${title}')">＋ ${title}を追加</button></div></div>`}
function addRow(id,title){let box=document.getElementById(id), b=box.querySelector(".addrow"), div=document.createElement("div");div.className="row";div.innerHTML=`<input placeholder="${title}"><input placeholder="分量"><button class="remove" onclick="this.parentElement.remove()">×</button>`;box.insertBefore(div,b)}
let pendingPhoto="";
function previewPhoto(input){let f=input.files[0];if(!f)return;let rd=new FileReader();rd.onload=e=>{let im=new Image();im.onload=()=>{let max=1000,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);pendingPhoto=c.toDataURL("image/jpeg",0.82);document.getElementById("preview").innerHTML=`<img src="${pendingPhoto}" style="width:220px;height:160px;object-fit:cover;border-radius:12px">`};im.src=e.target.result};rd.readAsDataURL(f)}
function collect(id){return [...document.querySelectorAll("#"+id+" .row")].map(x=>[x.children[0].value,x.children[1].value]).filter(x=>x[0])}
function saveNew(){let r={id:Date.now(),name:document.getElementById("name").value||"無題の料理",category:document.getElementById("cat").value||"その他",url:document.getElementById("url").value,ingredients:collect("ing"),seasonings:collect("sea"),records:[{date:new Date().toLocaleDateString("ja-JP"),photo:pendingPhoto,changes:document.getElementById("changes").value,memo:document.getElementById("memo").value,rating:Math.max(1,Math.min(5,+document.getElementById("rating").value||5)),best:false}]};data.unshift(r);try{save();pendingPhoto="";showDetail(r.id)}catch(e){data.shift();alert("保存できませんでした。写真の容量が大きい可能性があります。写真を外してもう一度保存してください。");console.error(e)}}
function showAddRecord(id){
 let r=data.find(x=>x.id===id); if(!r)return;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("detail").classList.add("hidden");
 let s=document.getElementById("add"); s.classList.remove("hidden");
 pendingPhoto="";
 s.innerHTML=`<button class="back" onclick="showDetail(${id})">← 戻る</button>
 <div class="form"><h1 class="page-title">${r.name}｜次回の記録</h1>
 <div class="field"><label>完成写真</label><input id="recordPhoto" type="file" accept="image/*" onchange="previewRecordPhoto(this)"><div id="recordPreview" style="margin-top:10px"></div></div>
 <div class="field"><label>今回のアレンジ・変更</label><textarea id="changes"></textarea></div>
 <div class="field"><label>感想</label><textarea id="memo"></textarea></div>
 <div class="field"><label>評価</label><input id="rating" type="number" min="1" max="5" value="5"></div>
 <div class="actions"><button class="primary" onclick="saveNewRecord(${id})">保存</button></div></div>`;
}
function previewRecordPhoto(input){
 let f=input.files[0]; if(!f)return;
 let rd=new FileReader();
 rd.onload=e=>{
  let im=new Image();
  im.onload=()=>{
   let max=1000,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
   c.getContext("2d").drawImage(im,0,0,c.width,c.height);
   pendingPhoto=c.toDataURL("image/jpeg",0.82);
   document.getElementById("recordPreview").innerHTML=`<img src="${pendingPhoto}" style="width:220px;height:160px;object-fit:cover;border-radius:12px">`;
  };
  im.src=e.target.result;
 };
 rd.readAsDataURL(f);
}
function saveNewRecord(id){
 let r=data.find(x=>x.id===id); if(!r)return;
 let rating=Math.max(1,Math.min(5,+document.getElementById("rating").value||5));
 r.records.push({date:new Date().toLocaleDateString("ja-JP"),photo:pendingPhoto,changes:document.getElementById("changes").value,memo:document.getElementById("memo").value,rating,best:false});
 try{save();pendingPhoto="";showDetail(id)}catch(e){r.records.pop();alert("保存できませんでした。写真の容量が大きい可能性があります。");}
}
function editRecord(id,i){
 let r=data.find(x=>x.id===id), x=r?.records[i]; if(!x)return;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("detail").classList.add("hidden");
 let s=document.getElementById("add"); s.classList.remove("hidden");
 pendingPhoto=x.photo||"";
 s.innerHTML=`<button class="back" onclick="showDetail(${id})">← 戻る</button>
 <div class="form"><h1 class="page-title">${r.name}｜${i+1}回目を編集</h1>
 <div class="field"><label>完成写真</label><input id="recordPhoto" type="file" accept="image/*" onchange="previewRecordPhoto(this)"><div id="recordPreview" style="margin-top:10px">${x.photo?`<img src="${x.photo}" style="width:220px;height:160px;object-fit:cover;border-radius:12px">`:"写真なし"}</div></div>
 <div class="field"><label>今回のアレンジ・変更</label><textarea id="changes">${escText(x.changes||"")}</textarea></div>
 <div class="field"><label>感想</label><textarea id="memo">${escText(x.memo||"")}</textarea></div>
 <div class="field"><label>評価</label><input id="rating" type="number" min="1" max="5" value="${x.rating||5}"></div>
 <div class="actions"><button class="primary" onclick="saveRecordEdit(${id},${i})">保存</button></div></div>`;
}
function escText(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function saveRecordEdit(id,i){
 let r=data.find(x=>x.id===id), x=r?.records[i]; if(!x)return;
 x.photo=pendingPhoto;
 x.changes=document.getElementById("changes").value;
 x.memo=document.getElementById("memo").value;
 x.rating=Math.max(1,Math.min(5,+document.getElementById("rating").value||5));
 try{save();pendingPhoto="";showDetail(id)}catch(e){alert("保存できませんでした。写真の容量が大きい可能性があります。");}
}
function promote(id,i){let r=data.find(x=>x.id===id);r.records.forEach(x=>x.best=false);r.records[i].best=true;save();showDetail(id)}
// IndexedDBから読み込んでから初回表示
initStorage();
</script>
<div style="position:fixed;left:10px;bottom:8px;z-index:9999;font-size:11px;opacity:.4;pointer-events:none">保存先：iPad内（IndexedDB）｜外食は「店舗＋訪問履歴」で保存</div>
